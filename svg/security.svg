<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" fill="#0a0a0b"/>
  <!-- Shield fill -->
  <path d="M100 30 L155 55 L155 110 Q155 150 100 175 Q45 150 45 110 L45 55 Z" fill="#6366f1" opacity=".1"/>
  <!-- Shield stroke -->
  <path d="M100 30 L155 55 L155 110 Q155 150 100 175 Q45 150 45 110 L45 55 Z" fill="none" stroke="#6366f1" stroke-width="1.5" opacity=".4"/>
  <!-- Inner shield -->
  <path d="M100 45 L143 65 L143 108 Q143 140 100 160 Q57 140 57 108 L57 65 Z" fill="none" stroke="#818cf8" stroke-width="1" opacity=".25"/>
  <!-- Lock body -->
  <rect x="85" y="95" width="30" height="24" rx="4" fill="#6366f1" opacity=".8"/>
  <!-- Lock shackle -->
  <path d="M90 95 L90 82 Q90 72 100 72 Q110 72 110 82 L110 95" fill="none" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="100" cy="105" r="3" fill="#0a0a0b"/>
  <rect x="99" y="105" width="2" height="6" rx="1" fill="#0a0a0b"/>
  <!-- Decorative grid lines -->
  <line x1="45" y1="75" x2="155" y2="75" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
  <line x1="50" y1="95" x2="150" y2="95" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
  <line x1="55" y1="115" x2="145" y2="115" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
  <line x1="65" y1="135" x2="135" y2="135" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
</svg>
