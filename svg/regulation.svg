<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" fill="#0a0a0b"/>
  <!-- Balance beam -->
  <line x1="60" y1="80" x2="140" y2="80" stroke="#818cf8" stroke-width="2" opacity=".6"/>
  <!-- Pivot -->
  <rect x="96" y="72" width="8" height="16" rx="2" fill="#6366f1" opacity=".8"/>
  <line x1="100" y1="88" x2="100" y2="150" stroke="#6366f1" stroke-width="2" opacity=".5"/>
  <!-- Base -->
  <rect x="80" y="148" width="40" height="4" rx="2" fill="#6366f1" opacity=".4"/>
  <!-- Left pan -->
  <line x1="60" y1="80" x2="45" y2="110" stroke="#818cf8" stroke-width="1.5" opacity=".4"/>
  <line x1="60" y1="80" x2="75" y2="110" stroke="#818cf8" stroke-width="1.5" opacity=".4"/>
  <path d="M42 110 Q60 122 78 110" stroke="#a5b4fc" stroke-width="1.5" fill="#6366f1" opacity=".2"/>
  <!-- Right pan -->
  <line x1="140" y1="80" x2="125" y2="110" stroke="#818cf8" stroke-width="1.5" opacity=".4"/>
  <line x1="140" y1="80" x2="155" y2="110" stroke="#818cf8" stroke-width="1.5" opacity=".4"/>
  <path d="M122 110 Q140 122 158 110" stroke="#a5b4fc" stroke-width="1.5" fill="#6366f1" opacity=".2"/>
  <!-- Document icon on left -->
  <rect x="52" y="92" width="16" height="14" rx="2" fill="#6366f1" opacity=".5"/>
  <line x1="55" y1="96" x2="65" y2="96" stroke="#a5b4fc" stroke-width="1" opacity=".6"/>
  <line x1="55" y1="100" x2="63" y2="100" stroke="#a5b4fc" stroke-width="1" opacity=".4"/>
  <!-- Gavel icon on right -->
  <rect x="134" y="92" width="12" height="6" rx="2" fill="#6366f1" opacity=".5"/>
  <line x1="140" y1="98" x2="140" y2="106" stroke="#818cf8" stroke-width="2" opacity=".5"/>
  <!-- Decorative hexagons -->
  <polygon points="100,40 108,44 108,52 100,56 92,52 92,44" fill="none" stroke="#6366f1" stroke-width=".8" opacity=".2"/>
  <polygon points="100,34 112,40 112,52 100,58 88,52 88,40" fill="none" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
</svg>
