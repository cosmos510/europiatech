<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" fill="#0a0a0b"/>
  <!-- Bulb glow -->
  <circle cx="100" cy="85" r="45" fill="#6366f1" opacity=".06"/>
  <circle cx="100" cy="85" r="30" fill="#6366f1" opacity=".08"/>
  <!-- Bulb outline -->
  <path d="M80 100 Q65 85 65 70 Q65 50 80 42 Q90 35 100 35 Q110 35 120 42 Q135 50 135 70 Q135 85 120 100" fill="none" stroke="#6366f1" stroke-width="2" opacity=".6"/>
  <!-- Bulb base -->
  <line x1="80" y1="100" x2="80" y2="115" stroke="#818cf8" stroke-width="2" opacity=".4"/>
  <line x1="120" y1="100" x2="120" y2="115" stroke="#818cf8" stroke-width="2" opacity=".4"/>
  <line x1="80" y1="107" x2="120" y2="107" stroke="#6366f1" stroke-width="1.5" opacity=".3"/>
  <line x1="80" y1="115" x2="120" y2="115" stroke="#6366f1" stroke-width="1.5" opacity=".3"/>
  <path d="M85 115 Q100 125 115 115" stroke="#818cf8" stroke-width="1.5" fill="none" opacity=".3"/>
  <!-- Filament / circuit inside -->
  <polyline points="92,95 92,70 100,60 108,70 108,95" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity=".6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spark rays -->
  <line x1="100" y1="25" x2="100" y2="15" stroke="#a5b4fc" stroke-width="1.5" opacity=".4" stroke-linecap="round"/>
  <line x1="55" y1="55" x2="48" y2="48" stroke="#818cf8" stroke-width="1.5" opacity=".3" stroke-linecap="round"/>
  <line x1="145" y1="55" x2="152" y2="48" stroke="#818cf8" stroke-width="1.5" opacity=".3" stroke-linecap="round"/>
  <line x1="50" y1="85" x2="40" y2="85" stroke="#6366f1" stroke-width="1" opacity=".2" stroke-linecap="round"/>
  <line x1="150" y1="85" x2="160" y2="85" stroke="#6366f1" stroke-width="1" opacity=".2" stroke-linecap="round"/>
  <!-- Small circuit nodes -->
  <circle cx="92" cy="70" r="2" fill="#a5b4fc" opacity=".7"/>
  <circle cx="108" cy="70" r="2" fill="#a5b4fc" opacity=".7"/>
  <circle cx="100" cy="60" r="2.5" fill="#a5b4fc"/>
  <!-- Bottom decorative dots -->
  <circle cx="90" cy="150" r="1.5" fill="#6366f1" opacity=".2"/>
  <circle cx="100" cy="155" r="1.5" fill="#6366f1" opacity=".15"/>
  <circle cx="110" cy="150" r="1.5" fill="#6366f1" opacity=".2"/>
</svg>
