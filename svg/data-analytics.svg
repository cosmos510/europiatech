<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" fill="#0a0a0b"/>
  <!-- Grid lines -->
  <line x1="40" y1="160" x2="170" y2="160" stroke="#6366f1" stroke-width="1" opacity=".2"/>
  <line x1="40" y1="130" x2="170" y2="130" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
  <line x1="40" y1="100" x2="170" y2="100" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
  <line x1="40" y1="70" x2="170" y2="70" stroke="#6366f1" stroke-width=".5" opacity=".1"/>
  <line x1="40" y1="40" x2="170" y2="40" stroke="#6366f1" stroke-width=".5" opacity=".08"/>
  <!-- Bars -->
  <rect x="50" y="110" width="16" height="50" rx="3" fill="#6366f1" opacity=".3"/>
  <rect x="75" y="80" width="16" height="80" rx="3" fill="#6366f1" opacity=".5"/>
  <rect x="100" y="55" width="16" height="105" rx="3" fill="#6366f1" opacity=".7"/>
  <rect x="125" y="70" width="16" height="90" rx="3" fill="#818cf8" opacity=".5"/>
  <rect x="150" y="45" width="16" height="115" rx="3" fill="#a5b4fc" opacity=".6"/>
  <!-- Trend line -->
  <polyline points="58,105 83,75 108,50 133,65 158,40" fill="none" stroke="#a5b4fc" stroke-width="2" opacity=".7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data dots -->
  <circle cx="58" cy="105" r="3" fill="#a5b4fc" opacity=".9"/>
  <circle cx="83" cy="75" r="3" fill="#a5b4fc" opacity=".9"/>
  <circle cx="108" cy="50" r="3" fill="#a5b4fc" opacity=".9"/>
  <circle cx="133" cy="65" r="3" fill="#a5b4fc" opacity=".9"/>
  <circle cx="158" cy="40" r="3" fill="#a5b4fc" opacity=".9"/>
</svg>
