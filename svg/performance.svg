<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" fill="#0a0a0b"/>
  <!-- Gauge arc -->
  <path d="M50 130 A60 60 0 0 1 150 130" fill="none" stroke="#6366f1" stroke-width="3" opacity=".25" stroke-linecap="round"/>
  <path d="M55 130 A55 55 0 0 1 130 78" fill="none" stroke="#818cf8" stroke-width="4" opacity=".6" stroke-linecap="round"/>
  <!-- Gauge ticks -->
  <line x1="50" y1="130" x2="55" y2="125" stroke="#6366f1" stroke-width="2" opacity=".4"/>
  <line x1="60" y1="95" x2="67" y2="98" stroke="#6366f1" stroke-width="2" opacity=".4"/>
  <line x1="85" y1="75" x2="88" y2="82" stroke="#818cf8" stroke-width="2" opacity=".5"/>
  <line x1="115" y1="75" x2="112" y2="82" stroke="#818cf8" stroke-width="2" opacity=".5"/>
  <line x1="140" y1="95" x2="133" y2="98" stroke="#6366f1" stroke-width="2" opacity=".3"/>
  <line x1="150" y1="130" x2="145" y2="125" stroke="#6366f1" stroke-width="2" opacity=".3"/>
  <!-- Needle -->
  <line x1="100" y1="130" x2="125" y2="82" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="130" r="5" fill="#6366f1"/>
  <circle cx="100" cy="130" r="2" fill="#a5b4fc"/>
  <!-- Speed lines -->
  <line x1="30" y1="155" x2="70" y2="155" stroke="#6366f1" stroke-width="1" opacity=".15"/>
  <line x1="40" y1="162" x2="90" y2="162" stroke="#6366f1" stroke-width="1.5" opacity=".1"/>
  <line x1="110" y1="162" x2="160" y2="162" stroke="#6366f1" stroke-width="1.5" opacity=".1"/>
  <line x1="130" y1="155" x2="170" y2="155" stroke="#6366f1" stroke-width="1" opacity=".15"/>
  <!-- Upward arrow -->
  <path d="M165 60 L165 40 L155 50" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity=".3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
