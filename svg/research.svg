<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" fill="#0a0a0b"/>
  <!-- Orbital rings -->
  <ellipse cx="100" cy="100" rx="60" ry="25" stroke="#6366f1" stroke-width="1" opacity=".2" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="60" ry="25" stroke="#818cf8" stroke-width="1" opacity=".2" transform="rotate(30 100 100)"/>
  <ellipse cx="100" cy="100" rx="60" ry="25" stroke="#6366f1" stroke-width="1" opacity=".15" transform="rotate(90 100 100)"/>
  <!-- Core nucleus -->
  <circle cx="100" cy="100" r="12" fill="#6366f1" opacity=".6"/>
  <circle cx="100" cy="100" r="6" fill="#a5b4fc" opacity=".8"/>
  <!-- Electron dots on orbits -->
  <circle cx="145" cy="78" r="4" fill="#a5b4fc" opacity=".7"/>
  <circle cx="62" cy="125" r="3.5" fill="#818cf8" opacity=".6"/>
  <circle cx="100" cy="40" r="3.5" fill="#818cf8" opacity=".5"/>
  <circle cx="130" cy="130" r="3" fill="#6366f1" opacity=".5"/>
  <!-- Magnifying glass hint -->
  <circle cx="150" cy="150" r="18" fill="none" stroke="#6366f1" stroke-width="1.5" opacity=".2"/>
  <line x1="163" y1="163" x2="175" y2="175" stroke="#6366f1" stroke-width="2" opacity=".2" stroke-linecap="round"/>
  <!-- Decorative particles -->
  <circle cx="40" cy="50" r="1.5" fill="#6366f1" opacity=".2"/>
  <circle cx="165" cy="45" r="1.5" fill="#818cf8" opacity=".15"/>
  <circle cx="35" cy="155" r="1" fill="#6366f1" opacity=".15"/>
  <circle cx="170" cy="160" r="1" fill="#818cf8" opacity=".1"/>
</svg>
